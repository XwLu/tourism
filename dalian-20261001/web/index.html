<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f4">
  <title>大连·丹东国庆行程地图 · 2026</title>
  <link rel="stylesheet" href="./map-assets/leaflet.css">
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #17302b;
      background: #f4f7f4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button { font: inherit; }
    .page { min-height: 100vh; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
    header { padding: 20px clamp(18px, 3vw, 42px) 14px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; align-items: end; }
    .eyebrow { margin: 0 0 4px; color: #55756c; font-size: 12px; letter-spacing: .1em; }
    h1 { margin: 0; font-size: clamp(23px, 3vw, 34px); font-weight: 650; letter-spacing: -.035em; }
    .subtitle { margin: 0 0 3px; color: #587069; font-size: 13px; }
    .dates { display: flex; gap: 8px; overflow-x: auto; padding: 0 clamp(18px, 3vw, 42px) 14px; scrollbar-width: thin; }
    .date-button { flex: none; border: 1px solid #cad8d2; border-radius: 999px; background: #fff; color: #35564c; padding: 9px 14px; cursor: pointer; white-space: nowrap; font-size: 13px; }
    .date-button[aria-pressed="true"] { background: #194d41; border-color: #194d41; color: #fff; }
    .main { display: grid; grid-template-columns: minmax(290px, 350px) minmax(0, 1fr); min-height: 620px; height: calc(100vh - 145px); border-top: 1px solid #dbe5df; }
    .sidebar { overflow-y: auto; padding: 20px 18px 28px clamp(18px, 3vw, 42px); background: #fbfcfa; border-right: 1px solid #dbe5df; }
    .day-title { margin: 0; font-size: 20px; line-height: 1.25; }
    .day-summary { color: #587069; margin: 6px 0 18px; font-size: 13px; line-height: 1.55; }
    .stop-list { list-style: none; padding: 0; margin: 0; }
    .stop-list li { position: relative; padding: 0 0 16px 22px; border-left: 1px solid #cbdad3; margin-left: 9px; }
    .stop-list li:last-child { border-color: transparent; }
    .stop-list li::before { content: ""; position: absolute; left: -5px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: #2f7e69; }
    .stop-list li.meal::before { background: #c06a3a; }
    .stop-list li.optional::before { background: #8877a4; }
    .stop-list li.transport::before { background: #487ea8; }
    .stop-list li.hotel::before { background: #254e45; }
    .stop-button { display: block; width: 100%; text-align: left; padding: 0; border: 0; background: none; color: inherit; cursor: pointer; }
    .stop-button:hover .stop-name, .stop-button:focus-visible .stop-name { text-decoration: underline; }
    .stop-time { display: block; color: #346958; font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .stop-name { display: block; margin: 3px 0; font-size: 15px; font-weight: 650; }
    .stop-detail { display: block; color: #5b716a; font-size: 12px; line-height: 1.55; }
    .stop-note { margin: 16px 0 0; padding: 12px 14px; background: #eaf2ed; border-radius: 10px; color: #49675c; font-size: 12px; line-height: 1.55; }
    .map-column { position: relative; min-width: 0; background: #e4eee9; }
    #map { height: 100%; width: 100%; background: #d8e8e7; }
    .map-caption { position: absolute; left: 14px; bottom: 20px; z-index: 900; max-width: min(480px, calc(100% - 28px)); padding: 8px 11px; background: rgba(255,255,255,.92); border-radius: 8px; box-shadow: 0 2px 12px rgba(20,56,43,.12); color: #52665f; font-size: 11px; line-height: 1.4; pointer-events: none; }
    .map-actions { position: absolute; top: 14px; right: 14px; z-index: 900; }
    .fit-button { border: 1px solid #d0ddd5; border-radius: 8px; background: #fff; box-shadow: 0 2px 10px rgba(20,56,43,.12); color: #20483d; padding: 8px 11px; cursor: pointer; font-size: 12px; }
    .map-status { position: absolute; top: 52px; right: 14px; z-index: 900; max-width: 240px; padding: 8px 10px; border-radius: 7px; background: #fff; color: #75532b; box-shadow: 0 2px 10px rgba(20,56,43,.12); font-size: 12px; }
    .map-status[hidden] { display: none; }
    .map-pin { background: transparent; border: 0; }
    .pin-content { display: flex; align-items: center; gap: 5px; width: max-content; white-space: nowrap; }
    .pin-dot { width: 16px; height: 16px; flex: none; border: 3px solid #fff; border-radius: 50%; background: #2f7e69; box-shadow: 0 1px 6px rgba(16,48,39,.35); }
    .map-pin.meal .pin-dot { background: #c06a3a; }
    .map-pin.optional .pin-dot { background: #8877a4; }
    .map-pin.transport .pin-dot { background: #487ea8; }
    .map-pin.hotel .pin-dot { background: #254e45; }
    .pin-label { display: inline-block; flex: 0 0 auto; width: max-content; max-width: 220px; overflow: hidden; text-overflow: ellipsis; padding: 5px 8px; background: #fff; border-radius: 6px; box-shadow: 0 1px 7px rgba(16,48,39,.18); color: #17302b; font-size: 12px; font-weight: 650; }
    .map-pin.overview .pin-label { display: none; }
    .popup-time { color: #2f6d5b; font-size: 12px; font-weight: 650; }
    .popup-name { margin: 4px 0 6px; color: #17302b; font-size: 16px; font-weight: 650; }
    .popup-detail { margin: 0; color: #52665f; font-size: 13px; line-height: 1.55; }
    .popup-note { margin: 8px 0 0; color: #835a37; font-size: 11px; }
    .leaflet-popup-content { min-width: 220px; max-width: 280px; margin: 14px 16px; }
    .leaflet-control-attribution { font-size: 10px; }
    @media (max-width: 760px) {
      .page { display: block; }
      header { padding-bottom: 12px; }
      .main { display: flex; flex-direction: column-reverse; height: auto; min-height: 0; }
      .map-column { height: min(59vh, 560px); min-height: 365px; }
      .sidebar { overflow: visible; border-right: 0; border-top: 1px solid #dbe5df; padding: 20px 18px 30px; }
      .map-caption { bottom: 20px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div><p class="eyebrow">2026 · 国庆旅行</p><h1>大连·丹东行程地图</h1></div>
      <p class="subtitle">选日期看路线 · 点击地点看时间与安排</p>
    </header>
    <nav class="dates" aria-label="选择行程日期" id="date-nav"></nav>
    <main class="main">
      <aside class="sidebar" aria-live="polite">
        <h2 class="day-title" id="day-title"></h2>
        <p class="day-summary" id="day-summary"></p>
        <ol class="stop-list" id="stop-list"></ol>
        <p class="stop-note" id="stop-note"></p>
      </aside>
      <div class="map-column">
        <div id="map" role="application" aria-label="可拖动和缩放的大连与丹东行程地图"></div>
        <div class="map-actions"><button class="fit-button" id="fit-button" type="button">适合当前路线</button></div>
        <p class="map-status" id="map-status" hidden></p>
        <div class="map-caption">滚轮、双击、双指或 ＋／－ 可缩放。实线表示市内顺序，虚线表示高铁方向；未确认门店不作精确定位。</div>
      </div>
    </main>
  </div>
  <script src="./map-assets/leaflet.js"></script>
  <script src="./map-assets/dalian-map.js"></script>
</body>
</html>
